<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crusoe AI Lifecycle Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: booth-style dark stage in the Crusoe Managed RL demo's visual language. A top bar with numbered
   pages; page 0 animates the whole flow on one lane map (workflow / MLflow / GPUs), pages 1-7 each explain
   one step: how it works, a live view, the differentiators, and the code. Single dark theme by design. */
:root{
  color-scheme:dark;
  --bg:#0F1011; --panel:#1B1D1E; --panel2:#232628; --line:#34373A; --ink:#FFFFFF; --muted:#BDBDBD; --dim:#8A8A8A;
  --accent:#CEEB13; --on-accent:#1B2000; --slate:#7799B6; --gold:#CD881A; --green:#738564;
  --cloud:#1C272C; --cloud-line:#3C5560;
  --good:#6CC46F; --warn:#E3A33A; --bad:#F06464;
  --g-sft:#5E93D6; --g-roll:#859B06; --g-train:#A47CDB; --g-inf:#D0782A; --g-idle:#2E3235;
  --py-k:#C792EA; --py-f:#82AAFF; --py-s:#C3E88D; --py-c:#6A737D;
  --f-display:"Roboto Mono",ui-monospace,Menlo,monospace;
  --f-body:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.4vw,40px);line-height:1.12}
h2{font-size:clamp(20px,2.2vw,26px);line-height:1.2}
h3{font-size:16px;font-weight:500;line-height:1.3}
p{margin:0}
code{font-family:var(--f-display);font-size:.9em}
.eyebrow{font-family:var(--f-display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.hl{color:var(--accent)}
.chip{font-family:var(--f-display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.chip.slate{background:var(--slate);color:#0B1216}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1400px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .inner{display:flex;align-items:center;gap:18px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:26px;display:block}
.brand .prod{font-family:var(--f-display);font-weight:700;font-size:15px;padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{font-family:var(--f-display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 12px 5px 5px;border-radius:999px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;border:1.5px solid transparent;white-space:nowrap}
.tab .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11.5px;background:var(--panel2);color:var(--muted)}
.tab:hover{color:var(--ink);border-color:var(--line)}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tab[aria-current="page"] .num{background:var(--on-accent);color:var(--accent)}
.tourbtn{font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted)}
.tourbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.ctx{border-bottom:1px solid var(--line);background:var(--bg)}
.ctx .inner{display:flex;flex-wrap:wrap;gap:10px 26px;padding-block:10px;align-items:center}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.ctl .eyebrow{font-size:11px;color:var(--dim)}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--panel);padding:3px;border-radius:999px;border:1px solid var(--line)}
.seg button{padding:4px 11px;border-radius:999px;font-size:13.5px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}

main .inner{padding-block:26px 40px;display:flex;flex-direction:column;gap:26px}
.page[hidden]{display:none!important}
.page{display:flex;flex-direction:column;gap:26px}

/* page head */
.phead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.phead > div{display:flex;flex-direction:column;gap:10px;min-width:0}
.phead .lede{color:var(--muted);font-size:17px;max-width:72ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{text-decoration:none;display:inline-block;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sim{font-family:var(--f-display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px dashed var(--line);padding:2px 8px;border-radius:999px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.small{font-size:13.5px}

/* scenario strip */
.scen{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.scen > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px;margin:0}
.facts dt{color:var(--dim);font-family:var(--f-display);font-size:11.5px;padding-top:2px;text-transform:uppercase;letter-spacing:.06em}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* ===== overview flow map ===== */
.flowwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.flow{position:relative;display:grid;grid-template-columns:118px minmax(0,1fr) 40px minmax(0,1fr) 40px minmax(0,1fr) 40px minmax(0,1fr) 40px minmax(0,1fr);grid-template-rows:56px auto auto auto;row-gap:10px}
.lanebg{grid-column:1/-1;border-radius:10px}
.lanebg.ml{grid-row:3;background:var(--cloud);border:1px solid var(--cloud-line)}
.lanebg.gp{grid-row:4;background:var(--panel2)}
.lanelab{grid-column:1;font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);align-self:center;padding-left:12px;z-index:1;line-height:1.35}
.lanelab b{display:block;color:var(--ink);font-weight:500;font-size:12px}
.st{all:unset;box-sizing:border-box;cursor:pointer;grid-row:2;display:flex;flex-direction:column;gap:5px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;position:relative;transition:border-color .3s,box-shadow .3s}
.st:hover{border-color:var(--muted)}
.st:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st .n{font-family:var(--f-display);font-size:11px;color:var(--dim)}
.st .t{font-family:var(--f-display);font-size:15px;font-weight:500;line-height:1.2}
.st .s{font-size:12.5px;color:var(--muted);line-height:1.3}
.st.sel{border-color:var(--ink)}
.st.run{border-color:var(--accent);box-shadow:0 0 0 3px rgba(206,235,19,.18)}
.st.done .n::after{content:" ✓";color:var(--accent)}
.pill{align-self:flex-start;font-family:var(--f-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.st.run .pill{border-color:var(--accent);color:var(--accent)}
.st.done .pill{border-color:var(--green);color:var(--muted)}
.conn{grid-row:2;position:relative;align-self:center;height:2px;background:var(--line)}
.conn::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:6px solid var(--line);border-right:0}
.conn.lit{background:var(--accent)}
.conn.lit::after{border-left-color:var(--accent)}
.tok{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:10.5px;background:var(--accent);color:var(--on-accent);padding:3px 8px;border-radius:999px;white-space:nowrap;opacity:0;z-index:3;pointer-events:none}
.tok:not(.go){display:none}
.tok.go{animation:tokx 1.1s ease-in-out forwards}
@keyframes tokx{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
.mlc{grid-row:3;z-index:1;padding:10px 6px;font-family:var(--f-display);font-size:11.5px;color:var(--slate);display:flex;flex-direction:column;gap:3px;opacity:.35;transition:opacity .4s;min-width:0}
.mlc b{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.mlc.on{opacity:1}
.mlc.drop b{animation:drop .6s ease-out}
@keyframes drop{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
.gpc{grid-row:4;z-index:1;padding:10px 6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:180px}
.mini i{display:block;aspect-ratio:1;border-radius:2px;background:var(--g-idle);transition:background .5s}
.gpc span{font-family:var(--f-display);font-size:10.5px;color:var(--dim)}
.arc{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.arc path.l{stroke:var(--line);transition:stroke .4s}
.arc.lit path.l{stroke:var(--accent)}
.arc text{font-family:var(--f-display);font-size:11px;fill:var(--muted)}
.arc.lit text{fill:var(--accent)}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.narr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr);gap:18px;align-items:start}
.narr .k{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
.narr > div{min-width:0}
.handoff{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* results bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;gap:12px;align-items:center;font-size:14px}
.bar .trk{height:18px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--dim);border-radius:0 4px 4px 0;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.bar.best .fill{background:var(--accent)}
.bar .val{font-family:var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.bar.best .val{color:var(--accent)}

/* step pages */
.how{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pipe{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.pbox{flex:1 1 0;min-width:150px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;transition:border-color .3s}
.pbox .n{font-family:var(--f-display);font-size:11px;color:var(--dim)}
.pbox .t{font-family:var(--f-display);font-size:14px;font-weight:500}
.pbox .s{font-size:12.5px;color:var(--muted)}
.pbox code{color:var(--slate);font-size:11.5px;overflow-wrap:anywhere}
.pbox.on{border-color:var(--accent)}
.parr{flex:0 0 26px;display:grid;place-items:center;color:var(--dim)}
.diff{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.diff h3{color:var(--accent)}
.diff .vs{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
.diff .vs b{color:var(--muted);font-weight:500;font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block}
.callouts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.callout{border-left:3px solid var(--slate);padding:10px 14px;background:var(--panel);border-radius:0 10px 10px 0;font-size:14.5px}
.callout.ev{border-left-color:var(--accent)}
.callout .k{font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.pnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}

/* tiles, records, tables */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--panel2);border-radius:10px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .l{font-size:12.5px;color:var(--muted)}
pre{margin:0;font-family:var(--f-display);font-size:12.5px;line-height:1.6}
.rec{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:260px;overflow:auto}
.rec pre{white-space:pre-wrap;word-break:break-word}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-family:var(--f-display);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.num,table.t th.num{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.ok{color:var(--good)}.partial{color:var(--warn)}.no{color:var(--bad)}

/* charts */
.chartbox{position:relative}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-display);font-size:10.5px;fill:var(--dim)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-size:11.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-125%);z-index:4}

/* code */
.code{background:#0B0C0D;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.code .cbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.code .fn{font-family:var(--f-display);font-size:12px;color:var(--dim)}
.code .cp{border:1px solid var(--line);font-size:12px;padding:3px 10px;border-radius:999px;color:var(--muted);font-family:var(--f-display)}
.code pre{color:#E6E6E6;padding:14px 16px;overflow-x:auto;white-space:pre}
.code .k{color:var(--py-k)}.code .f{color:var(--py-f)}.code .s{color:var(--py-s)}.code .c{color:var(--py-c)}
.codenote{font-size:12.5px;color:var(--dim);padding:0 16px 12px}

/* RL loop */
.loopgrid{display:grid;grid-template-columns:minmax(0,.9fr) 92px minmax(0,1.2fr);gap:0;align-items:stretch}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side .hd{font-family:var(--f-display);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ybox{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:24px 1fr;gap:4px 10px;transition:border-color .25s,background .25s}
.ybox .i{grid-row:span 2;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted)}
.ybox .t{font-family:var(--f-display);font-size:13.5px;font-weight:500}
.ybox .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ybox.on{border-color:var(--accent);background:rgba(206,235,19,.06)}
.ybox.on .i{background:var(--accent);color:var(--on-accent)}
.wire{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 6px}
.w{font-family:var(--f-display);font-size:10.5px;color:var(--dim);text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;transition:color .25s}
.w .ln{width:100%;height:2px;background:var(--line);position:relative;transition:background .25s}
.w.r .ln::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:6px solid var(--line);border-right:0}
.w.l .ln::before{content:"";position:absolute;left:-1px;top:-4px;border:5px solid transparent;border-right:6px solid var(--line);border-left:0}
.w.on{color:var(--accent)} .w.on .ln{background:var(--accent)}
.w.on.r .ln::after{border-left-color:var(--accent)} .w.on.l .ln::before{border-right-color:var(--accent)}
.cloud{background:var(--cloud);border:1.5px solid var(--cloud-line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cloud .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.cbox{background:var(--bg);border:1.5px solid var(--cloud-line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;transition:border-color .25s,background .25s}
.cbox .t{font-family:var(--f-display);font-size:13.5px;font-weight:500;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cbox .s{font-size:12.5px;color:var(--muted)}
.cbox code{color:var(--slate)}
.cbox.on{border-color:var(--accent);background:rgba(206,235,19,.06)}
.cbox.on code{color:var(--accent)}
.vw{font-family:var(--f-display);font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;padding:0 12px;flex-wrap:wrap}
.vw span{transition:color .25s}
.vw span.on{color:var(--accent)}
.stepline{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-display)}
.stepline .big{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.stepline .call{font-size:13px;color:var(--accent);background:rgba(206,235,19,.08);border:1px solid rgba(206,235,19,.35);padding:3px 10px;border-radius:999px}
.group{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:92px;border-bottom:1px solid var(--line);position:relative}
.group i{display:block;border-radius:4px 4px 0 0;background:var(--dim);transition:height .3s}
.group i.pos{background:var(--accent)}
.group .mean{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted)}
.glab{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;font-family:var(--f-display);font-size:10.5px;color:var(--dim);text-align:center}
.flash{animation:flash 1s}
@keyframes flash{0%{border-color:var(--accent);background:rgba(206,235,19,.18)}}

/* serve */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}
.msg.u{background:var(--panel2)}
.msg.a{border:1px solid var(--line);min-height:70px;background:var(--bg)}
.msg .who{font-family:var(--f-display);font-size:11px;color:var(--dim);display:block;margin-bottom:4px}
.msg pre{white-space:pre-wrap;word-break:break-word}
.caret::after{content:"▍";color:var(--accent);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-display);font-size:12px;color:var(--muted)}
.claim{font-size:14px;color:var(--muted);border-left:3px solid var(--accent);padding:6px 12px}
.claim b{color:var(--ink);font-weight:600}
.opt{display:flex;flex-direction:column;gap:8px;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--panel);min-width:0}
.opt.pick{border-color:var(--accent)}
.opt ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}

/* platform */
.fleet{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.fleet i{display:block;aspect-ratio:1;border-radius:3px;background:var(--g-idle);transition:background .5s}
.pitch{width:100%;border-collapse:collapse;font-size:14px;min-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pitch th{text-align:left;font-family:var(--f-display);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.pitch td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.pitch tr:last-child td{border-bottom:0}
.pitch td:first-child{font-family:var(--f-display);font-weight:500;white-space:nowrap}
.pitch td.diy{color:var(--dim)}
.pitch td.lens{color:var(--accent)}
.ros{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.beat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.beat .tm{font-family:var(--f-display);font-size:12px;color:var(--accent)}
.beat p{font-size:14px;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.lnk{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.lnk:hover{border-color:var(--accent)}
.lnk span{font-family:var(--f-display);font-size:12.5px;color:var(--accent);overflow-wrap:anywhere}
.lnk p{font-size:14px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px;max-width:110ch}
.keys{font-family:var(--f-display);font-size:11.5px;color:var(--dim)}
kbd{font-family:var(--f-display);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel)}

@media (max-width:1080px){
  .tabs{margin-left:0;width:100%}
  .two,.narr,.scen,.phead{grid-template-columns:1fr}
  .three{grid-template-columns:1fr}
  .callouts{grid-template-columns:1fr}
}
@media (max-width:900px){
  .flow{grid-template-columns:1fr;grid-template-rows:none;row-gap:0}
  .flow .lanebg,.flow .lanelab,.flow .arc{display:none}
  .flow > *{grid-column:1!important;grid-row:auto!important}
  .st{margin-top:10px}
  .mlc,.gpc{background:var(--panel2);flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-radius:0}
  .mlc{background:var(--cloud);border-radius:0;opacity:1}
  .gpc{border-radius:0 0 12px 12px}
  .mini{max-width:120px}
  .conn{height:26px;width:2px;justify-self:center;margin-top:10px}
  .conn::after{right:auto;left:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top:6px solid var(--line);border-bottom:0}
  .conn.lit::after{border-top-color:var(--accent);border-left-color:transparent}
  .tok.go{animation:toky 1.1s ease-in-out forwards}
  @keyframes toky{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}
  .tok{left:50%}
  .loopgrid{grid-template-columns:1fr}
  .wire{flex-direction:row;padding:10px 0;gap:10px}
  .wire .w{flex:1}
  .fleet{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.bar{grid-template-columns:80px 1fr 54px}.brand .prod{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const SCEN = {
  phys:{label:'Physical AI', name:'Warehouse manipulation planner', slug:'pick-planner',
    customer:'A robotics company whose arms pick mixed parts in fulfilment centres.',
    goal:'The perception stack describes the bin as a scene graph. The model turns that and an instruction into a safe action plan the robot controller can execute.',
    base:'Qwen/Qwen3-8B',
    data:{rows:'38,400', sources:'teleoperation logs, simulator episodes and failure reports', split:'36,000 train · 2,400 validation · 6,000 RL prompts',
      tiles:[['38.4k','teleop episodes'],['6,000','RL scenes for the simulator'],['17','robot skill primitives']],
      sample:`{"messages": [
  {"role": "system", "content": "Plan with skills: move_to, grasp, lift, place, nudge..."},
  {"role": "user", "content": "Scene: bin A3 {motor_box x2 (sealed), bracket_01 (loose)}.
     Move the loose bracket to tote T7. Do not touch the boxes."},
  {"role": "assistant", "content": "[{\\"skill\\":\\"move_to\\",\\"target\\":\\"A3.above\\"},
     {\\"skill\\":\\"grasp\\",\\"object\\":\\"bracket_01\\",\\"grip\\":\\"pinch\\"},
     {\\"skill\\":\\"lift\\",\\"height_cm\\":12}, ... ]"}
]}`},
    ft:{steps:2400, train:[1.92,0.41], valid:[1.95,0.49]},
    rl:{what:'Each candidate plan is executed in a physics simulator. Plans that finish the task without collisions score higher, so the policy learns from outcomes rather than imitation alone.',
      rewards:[['sim_task_success',0.50,'Plan completes the task in the physics simulator'],['collision_free',0.20,'No contact with non-target objects'],['schema_valid',0.15,'Plan parses against the skill schema'],['step_efficiency',0.15,'Steps used versus the optimal plan']],
      r:[0.38,0.86],
      prompt:'Scene: bin C1 {motor_box x2 (stacked), hinge_04 (loose, against wall)}. Move the hinge to tote T2.',
      out:`[{"skill":"move_to","target":"C1.above"},
 {"skill":"nudge","object":"hinge_04","dir":"away_from_wall","cm":3},
 {"skill":"grasp","object":"hinge_04","grip":"pinch"},
 {"skill":"lift","height_cm":14},
 {"skill":"move_to","target":"T2.above"},
 {"skill":"place","object":"hinge_04"}]`,
      checks:[['sim_task_success','Hinge placed in T2 in 3 of 3 seeded sim runs',1],['collision_free','0 contacts with motor boxes',1],['schema_valid','All 6 steps parse',1],['step_efficiency','6 steps vs. 5 optimal',0.83]]},
    ev:{metric:'Sim task success', unit:'%', vals:[41,63,84], guards:['Collision rate ≤ 2%','Schema validity 100%','p95 latency within budget']},
    serve:{prompt:'Scene: bin B6 {lid_cracked (on top), carton x3 (sealed)}. Remove the cracked lid to reject chute R1.',
      resp:'[{"skill":"move_to","target":"B6.above"},{"skill":"grasp","object":"lid_cracked","grip":"wide"},{"skill":"lift","height_cm":20},{"skill":"move_to","target":"R1.above"},{"skill":"place","object":"lid_cracked"}]',
      fb:'Plans the on-robot safety monitor aborts are logged with the scene and become new simulator tasks for the next RL run.'}},
  fsi:{label:'Financial services', name:'AML alert triage agent', slug:'aml-triage',
    customer:'A retail bank whose compliance team reviews thousands of transaction-monitoring alerts a week.',
    goal:'Read an alert and the account history, decide whether to close or escalate, and draft a narrative that cites the exact transactions and policy rules.',
    base:'Qwen/Qwen3.8-27B',
    data:{rows:'210,000', sources:'closed alerts with analyst decisions, the policy manual and transaction ledgers', split:'200,000 train · 4,000 validation · 6,000 RL prompts',
      tiles:[['210k','analyst-labelled alerts'],['46','policy rules'],['3.1 yrs','of decisions']],
      sample:`{"messages": [
  {"role": "system", "content": "You are an AML analyst. Cite TXN IDs and rule numbers."},
  {"role": "user", "content": "ALRT-20931 (Rule S-2): 14 cash deposits of $9,400-$9,900
     across 3 branches in 6 days. Account opened 41 days ago. TXN-88412 ..."},
  {"role": "assistant", "content": "Disposition: ESCALATE. Deposits consistently below
     the $10,000 CTR threshold (Rule S-2): TXN-88412, TXN-88419, ..."}
]}`},
    ft:{steps:3100, train:[1.64,0.52], valid:[1.66,0.58]},
    rl:{what:'Each draft disposition is checked against the analyst label, every cited transaction is looked up in the case file, and the policy checklist is scored. Invented evidence is penalised.',
      rewards:[['disposition_match',0.45,'Close or escalate matches the analyst decision'],['citations_exist',0.25,'Every cited TXN ID exists in the case file'],['policy_checklist',0.20,'Required rules are addressed'],['narrative_format',0.10,'Narrative follows the SAR template']],
      r:[0.47,0.88],
      prompt:'ALRT-21407: 9 incoming wires from 7 unrelated senders, funds moved out within 48 hours to one overseas beneficiary. 3-year-old personal checking account.',
      out:`Disposition: ESCALATE for SAR review.
Pattern consistent with a pass-through account (Rule L-3): inflows from
7 unrelated senders (TXN-90211…TXN-90244) moved out within 48 hours
to a single beneficiary (TXN-90251). No business purpose on file (Rule K-1).`,
      checks:[['disposition_match','ESCALATE matches analyst label',1],['citations_exist','10 of 10 cited TXN IDs found',1],['policy_checklist','L-3, K-1 addressed; P-7 missing',0.67],['narrative_format','Follows SAR template',1]]},
    ev:{metric:'Disposition accuracy', unit:'%', vals:[68,81,92], guards:['Missed escalations ≤ 1%','0 invented TXN IDs','Model risk sign-off']},
    serve:{prompt:'ALRT-21522: 22 card-present purchases at one electronics store in 3 days, total $18,700. Customer has 9 years of history, average monthly spend $1,100.',
      resp:'Disposition: ESCALATE for fraud review. Spend is 17x the 12-month monthly average (Rule F-2), concentrated at a single merchant (TXN-91877…TXN-91912). Recommend a card hold and customer contact before a SAR decision (Rule P-7).',
      fb:'Every analyst override of the model\'s disposition is stored with the alert and becomes a labelled example for the next RL run.'}},
  health:{label:'Healthcare', name:'Clinical coding assistant', slug:'icd-coder',
    customer:'A health system\'s revenue-cycle team coding inpatient discharge summaries.',
    goal:'Read a de-identified discharge summary and return ICD-10-CM codes, each backed by a quoted span from the note.',
    base:'Qwen/Qwen3-8B',
    data:{rows:'94,000', sources:'de-identified discharge summaries with coder-assigned codes and the ICD-10-CM FY2026 code set', split:'88,000 train · 2,000 validation · 4,000 RL prompts',
      tiles:[['94k','coded encounters'],['74k+','valid ICD-10-CM codes'],['0','PHI fields retained']],
      sample:`{"messages": [
  {"role": "system", "content": "Return ICD-10-CM codes, each with a quoted evidence span."},
  {"role": "user", "content": "72M admitted with acute on chronic systolic heart failure.

  {"role": "assistant", "content": "I13.0  \\"hypertension ... heart failure ... CKD\\"
     I50.23 \\"acute on chronic systolic heart failure\\"
     E11.22 \\"type 2 diabetes with diabetic CKD\\"
     N18.31 \\"CKD stage 3a\\""}
]}`},
    ft:{steps:1800, train:[1.78,0.47], valid:[1.80,0.55]},
    rl:{what:'Predicted codes are scored against the coder\'s set, checked for validity in the code set, and each must point to a span that really appears in the note.',
      rewards:[['code_set_f1',0.50,'F1 against the certified coder\'s codes'],['codes_valid',0.20,'Every code exists in ICD-10-CM FY2026'],['evidence_grounded',0.20,'Each code quotes a span found in the note'],['no_phi_echo',0.10,'No identifiers repeated in the output']],
      r:[0.44,0.85],
      prompt:'64F with community-acquired pneumonia, right lower lobe. Course complicated by sepsis without shock. History of COPD.',
      out:`J18.9   "community-acquired pneumonia, right lower lobe"
A41.9   "sepsis without shock"
J44.9   "History of COPD"`,
      checks:[['code_set_f1','3 of 3 match; coder also added R65.20 → F1 0.86',0.86],['codes_valid','3 of 3 codes valid',1],['evidence_grounded','3 of 3 spans found in note',1],['no_phi_echo','No identifiers in output',1]]},
    ev:{metric:'Code-set micro-F1', unit:'', vals:[0.52,0.71,0.83], guards:['0 invalid codes','Evidence on every code','Documentation team review']},
    serve:{prompt:'58M with NSTEMI. Underwent PCI with drug-eluting stent to the LAD. History of hyperlipidemia and tobacco use.',
      resp:'I21.4   "NSTEMI"\nE78.5   "hyperlipidemia"\nZ72.0   "tobacco use"\n(Procedure codes for the PCI are routed to the PCS coder.)',
      fb:'Codes that human coders change at final review are captured with the note and feed the next RL run as new reward examples.'}},
  bio:{label:'Biotech', name:'Kinase inhibitor generator', slug:'egfr-gen',
    customer:'A drug-discovery startup searching for new EGFR inhibitor scaffolds.',
    goal:'Propose novel small molecules as SMILES strings that dock well against the target and stay drug-like and synthesizable.',
    base:'Qwen/Qwen3-8B',

      sample:`{"messages": [
  {"role": "system", "content": "Propose drug-like molecules as SMILES."},
  {"role": "user", "content": "EGFR inhibitor with a quinazoline core and a solubilising group."},

function rng(seed){ let s = seed>>>0 || 1; return ()=> (s = (s*1664525+1013904223)>>>0)/4294967296; }
const seedOf = s => [...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function curve(n, a, b, shape, noise, seed){
  const r = rng(seed), out=[];
  for(let i=0;i<n;i++){ const x=i/(n-1);
    const base = shape==='decay' ? b+(a-b)*Math.exp(-4.2*x) : a+(b-a)*(1-Math.exp(-3.1*x))/(1-Math.exp(-3.1));
    out.push(base + (r()-0.5)*noise*(shape==='decay'?(0.4+(1-x)):1)); }
  return out;
}
function hl(code){
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(import|from|for|in|as|def|return|with|if|else|not|and|True|False|None|export)\b|\b([A-Za-z_][A-Za-z0-9_]*)(?=\()/g;
  let out='', last=0, m;
  while((m = re.exec(code))){ out += esc(code.slice(last, m.index));
    out += m[1] ? `<span class="c">${esc(m[1])}</span>` : m[2] ? `<span class="s">${esc(m[2])}</span>` : m[3] ? `<span class="k">${m[3]}</span>` : `<span class="f">${esc(m[4])}</span>`;
    last = re.lastIndex; }
  return out + esc(code.slice(last));
}

/* line chart: series = [{data, color, label}] */
function lineChart(box, series, {xLabel, xMax, fmt, lo, hi, upto, animate=true}){
  const W=600,H=230,L=46,R=70,T=12,B=32, n=series[0].data.length, last = upto ?? n-1;
  const x = i => L + (W-L-R)*i/(n-1), y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4; g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}</text>`; }
  [0,.25,.5,.75,1].forEach(f=>{ g+=`<text x="${L+(W-L-R)*f}" y="${H-14}" text-anchor="middle">${Math.round(xMax*f).toLocaleString()}</text>`; });
  g+=`<text x="${W-R}" y="${H}" text-anchor="end">${esc(xLabel)}</text>`;
  const lines = series.map((s,si)=>{ const pts = s.data.slice(0,last+1).map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    const area = si===0 && series.length===1 && pts.length>1 ? `<path d="M${pts[0]} L${pts.join(' L')} L${x(last)},${y(lo)} L${x(0)},${y(lo)}Z" fill="${s.color}" opacity=".12"/>` : '';
    const lab = series.length>1 ? `<text x="${x(last)+9}" y="${y(s.data[last])+4}" style="fill:var(--muted)">${esc(s.label)}</text>` : '';
    return `${area}<polyline class="ln" points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(last)}" cy="${y(s.data[last])}" r="4.5" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>${lab}`; }).join('');
  box.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.label).join(', '))} by ${esc(xLabel)}">${g}${lines}
    <line class="xh" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
    <rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = svg.querySelector('.xh');
  if(animate && !RM) svg.querySelectorAll('.ln').forEach(ln=>{ const len=ln.getTotalLength(); ln.style.strokeDasharray=len; ln.style.strokeDashoffset=len; ln.getBoundingClientRect(); ln.style.transition='stroke-dashoffset 2s ease-out'; ln.style.strokeDashoffset=0; });
  const hit = svg.querySelector('.hit');
  hit.addEventListener('pointermove', e=>{ const r=svg.getBoundingClientRect(), sx=(e.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(last,Math.round((sx-L)/(W-L-R)*(n-1))));
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.setAttribute('opacity',1);
    tip.hidden=false; tip.style.left=(x(i)*r.width/W)+'px'; tip.style.top=(y(series[0].data[i])*r.height/H)+'px';
    tip.textContent = `step ${Math.round(xMax*i/(n-1)).toLocaleString()} · ` + series.map(s=>`${s.label} ${fmt(s.data[i])}`).join(' · '); });
  hit.addEventListener('pointerleave', ()=>{ tip.hidden=true; xh.setAttribute('opacity',0); });
}

      ${[[9,16,'2e-5',4,-0.07],[10,32,'4e-5',4,-0.04],[11,32,'4e-5',8,-0.02],[12,32,'4e-5',8,0],[13,64,'8e-5',8,-0.09]].map(r=>{ const fr=(S.rl.r[1]+r[4]); const ev=S.ev.unit==='%'?Math.round(S.ev.vals[2]+r[4]*100)+'%':(S.ev.vals[2]+r[4]).toFixed(2);
        return `<tr${r[4]===0?' style="color:var(--accent)"':''}><td><code>grpo-${esc(S.slug)} #${r[0]}</code>${r[4]===0?' → v7':''}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${fr.toFixed(2)}</td><td>${ev}</td></tr>`; }).join('')}</tbody></table></div></div>
    ${diffs([['No server to run','A hosted tracking server, artifact store and registry in the Crusoe Console, authenticated with the same API key as everything else.','Deploy MLflow, a database and object storage, then patch and back them up.'],['Your code already works','Standard MLflow APIs for runs, tracing, GenAI evaluation and prompts. Set the tracking URI and workspace; nothing else changes.','Rewrite logging for a proprietary tracking tool.'],['Promotion with an audit trail','Registry aliases and lineage connect every deployed model to its data, runs and evaluation.','Promote by copying checkpoints and hoping someone wrote it down.']])}
    ${callouts(id)}
    ${codeBlock('evaluate_and_promote.py',`import mlflow
from mlflow.genai.scorers import scorer

@scorer
def ${S.rl.rewards[0][0]}(outputs, expectations) -> float:
    return check_${S.rl.rewards[0][0]}(outputs, expectations)     # same check as the RL reward

results = mlflow.genai.evaluate(
    data=held_out,                       # ${esc(S.data.split.split('·')[1]?.trim()||'held-out set')}
    predict_fn=call_model,               # base, SFT and RL candidates in turn
    scorers=[${S.rl.rewards[0][0]}],
)

mv = mlflow.register_model(f"runs:/{rl_run_id}/adapter", "${S.slug}")
mlflow.MlflowClient().set_registered_model_alias("${S.slug}", "champion", mv.version)`, 'Evaluation with Python scorers follows the managed-mlflow cookbook (03_evaluation.py).')}
    ${pnav(id)}${FOOT}</section>`;
}

/* ============ page 5: serve ============ */
function pageServe(){

  return `<section class="page">${head('Step 05 of 05 · Crusoe Managed Inference','Serve the model, and keep improving it',`The champion version goes behind an OpenAI-compatible endpoint. Every request is traced back into Managed MLflow, and the hard cases feed the next RL run.`, '<span class="chip">Crusoe Managed Inference</span><span class="chip ghost">Self-Serve Endpoints</span><span class="chip ghost">MemoryAlloy™ technology</span>')}

    <div class="two">
      <div class="card"><div class="cardhead"><h3>Endpoint ${esc(S.slug)}-prod</h3><span class="sim">Simulated</span></div>
        <div class="chat"><div class="msg u"><span class="who">request</span>${esc(S.serve.prompt)}</div><div class="msg a"><span class="who">${esc(S.slug)} v7 @champion</span><pre id="out"></pre></div></div>
        <div class="meta"><span>OpenAI-compatible</span><span>dedicated deployment</span><span>trace → MLflow</span></div>
        <div class="btnrow"><button class="btn primary" id="sendBtn">Send request</button></div></div>
      <div class="col" style="display:flex;flex-direction:column;gap:14px">
        <div class="opt"><span class="eyebrow">Shared models</span><h3>Serverless inference</h3><ul><li>Popular open models ready to call, billed per token</li><li>Used here for the base model and the LLM judge in evaluation</li></ul></div>
        <div class="opt pick"><span class="eyebrow">Your model</span><h3>Self-Serve Endpoints</h3><ul><li>Deploy your fine-tuned or RL checkpoint as a dedicated deployment</li><li>Choose an optimization profile and replica count in Crusoe Intelligence Foundry</li><li>Call it by its alias with the same OpenAI client</li></ul></div>
        <p class="claim">Crusoe Managed Inference, powered by MemoryAlloy™ technology: <b>9.9x faster time to first token</b> and <b>5x higher throughput</b> than vLLM on GPT-OSS-120B.</p>
      </div>
    </div>
    ${diffs([['Fast on the same hardware','MemoryAlloy™ technology delivers 9.9x faster TTFT and 5x higher throughput than vLLM on GPT-OSS-120B, which lowers cost per token.','Tune an open-source server yourself and pay for the idle headroom.'],['From checkpoint to API in minutes','Pick the checkpoint, pick a profile, get an alias. The app calls it with the OpenAI SDK it already uses.','Build containers, autoscaling and rollout tooling for every model version.'],['Production closes the loop','Traces land in Managed MLflow next to the training runs, so the hard cases become the next RL run\'s prompts.','Production logs live in a different system from training, and nobody joins them.']])}
    ${callouts(id)}
    <div class="two">${codeBlock('call_endpoint.py',`import mlflow
from openai import OpenAI

mlflow.openai.autolog()            # each call becomes a trace in Managed MLflow

client = OpenAI(api_key=CRUSOE_API_KEY,
                base_url="https://api.inference.crusoecloud.com/v1")
resp = client.chat.completions.create(
    model=DEPLOYMENT_ALIAS,        # your Self-Serve Endpoint
    messages=[{"role": "user", "content": request}],
)
print(resp.choices[0].message.content)`, 'Matches the deployment and tracing examples in crusoe-developer-hub.')}
      ${codeBlock('mlflow_deployments.py',`import mlflow.deployments

# pip install mlflow-crusoe
client = mlflow.deployments.get_deploy_client("crusoe")
client.create_deployment(name="${S.slug}", model_uri="${S.base}",
                         config={"temperature": 0.2, "max_tokens": 1024})
result = client.predict("${S.slug}", inputs={"messages": [
    {"role": "user", "content": request}]})`, 'The mlflow-crusoe deployment plugin manages endpoint configurations from MLflow.')}</div>
    ${pnav(id)}${FOOT}</section>`;
}
function stream(){ const S=SCEN[state.scen], o=$('#out'); if(!o) return; const my=runToken; o.textContent=''; o.classList.add('caret'); const txt=S.serve.resp; let i=0;
  const tick=()=>{ if(my!==runToken||!document.body.contains(o)) return; i+=Math.max(2,Math.round(txt.length/90)); o.textContent=txt.slice(0,i); if(i<txt.length) setTimeout(tick,26); else o.classList.remove('caret'); }; setTimeout(tick,300); }

/* ============ page 6: platform ============ */
const FLEET = {data:[0,0,0,0], finetune:[32,0,0,0], rl:[0,24,16,0], mlflow:[0,0,0,8], serve:[0,8,8,16]};

    ${codeBlock('cluster_view.sh',`# Path B training on your own cluster
sbatch --nodes=4 --gpus-per-node=8 train_sft.sbatch        # Managed Slurm
kubectl apply -f sft-job.yaml                               # Crusoe Managed Kubernetes
kubectl get nodes -L nvidia.com/gpu.product                 # GPU inventory`)}
    ${pnav(id)}${FOOT}</section>`;
}
async function animFleet(){ const my=runToken; let i=0;
  const show=k=>{ paintCells([...document.querySelectorAll('#fleet i')], FLEET[k]); $('#fleetCap').textContent=FLEETCAP[k]; document.querySelectorAll('#fleetSeg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===k)); };
  $('#fleetSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; runToken++; show(b.dataset.f); };
  while(my===runToken){ show(STEPS[i].id); i=(i+1)%STEPS.length; await wait(2600); } }

/* ============ router ============ */
const RENDER = {flow:pageFlow, data:pageData, finetune:pageFinetune, rl:pageRL, mlflow:pageMlflow, serve:pageServe, platform:pagePlatform, why:pageWhy};
function renderChrome(){
  $('#tabs').innerHTML = PAGES.map(p=>`<a class="tab" href="#${p.id}" ${state.page===p.id?'aria-current="page"':''} style="text-decoration:none"><span class="num">${p.n}</span>${esc(p.t)}</a>`).join('');
  const seg=(el,obj,key)=>{ el.innerHTML=Object.entries(obj).map(([k,v])=>`<button data-k="${k}" aria-pressed="${state[key]===k}">${esc(v.label)}</button>`).join('');
    el.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; state[key]=b.dataset.k; save(); renderChrome(); renderPage(); }; };
  seg($('#segScen'), SCEN, 'scen'); seg($('#segPersona'), PERSONA, 'persona'); seg($('#segEvent'), EVENT, 'event');
}
function renderPage(){
  runToken++;
  $('#root').innerHTML = RENDER[state.page]();
  const p = state.page;
  if(p==='flow'){
    narrate(state.flowSel); requestAnimationFrame(()=>drawArc(false));
    document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{ runToken++; state.flowSel=b.dataset.st; narrate(b.dataset.st); const btn=$('#playFlow'); if(btn) btn.textContent='▶ Play the flow'; });
    $('#playFlow').onclick=()=>playFlow();
    STEPS.forEach(s=>paintCells([...document.querySelector(`[data-gp="${s.id}"]`).querySelectorAll('i')], s.gpu));
    document.querySelectorAll('.mlc').forEach(m=>m.classList.add('on'));
    growBars(document);
  }
  if(p==='data') animPipe('#dpipe',5,1300);
  if(p==='finetune') animFt();
  if(p==='rl'){ animRL(); $('#rlRestart').onclick=()=>animRL(); }
  if(p==='mlflow'){ growBars(document); animPipe('#mlpipe',6,1000); }
  if(p==='serve'){ stream(); $('#sendBtn').onclick=stream; animPipe('#svpipe',5,1200); }
  if(p==='platform') animFleet();
}
function route(){
  const h = location.hash.replace('#','');
  state.page = RENDER[h] ? h : 'flow';
  renderChrome(); renderPage(); window.scrollTo(0,0);
}
addEventListener('hashchange', route);
addEventListener('resize', ()=>{ if(state.page==='flow') drawArc($('#arc')?.classList.contains('lit')); });

/* keyboard + tour */
document.addEventListener('keydown', e=>{
  if(e.target.closest('input,textarea,select')) return;
  const i = PAGES.findIndex(p=>p.id===state.page);
  if(/^[0-7]$/.test(e.key)) location.hash = PAGES[+e.key].id;
  else if(e.key==='ArrowRight' && i<PAGES.length-1) location.hash = PAGES[i+1].id;
  else if(e.key==='ArrowLeft' && i>0) location.hash = PAGES[i-1].id;
  else if((e.key===' ') && state.page==='flow' && !e.target.closest('button,a')){ e.preventDefault(); playFlow(); }
  else if(e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.().catch(()=>{});
});
let tourT=null;
async function tour(){
  const order=['flow','data','finetune','rl','mlflow','serve','platform'], dwell={data:14000,finetune:16000,rl:36000,mlflow:16000,serve:14000,platform:14000};
  while(state.tour){
    for(const pg of order){ if(!state.tour) return;
      location.hash = pg; await new Promise(r=>setTimeout(r,50));
      if(pg==='flow'){ await playFlow(); await new Promise(r=>tourT=setTimeout(r,4000)); }
      else await new Promise(r=>tourT=setTimeout(r,dwell[pg]));
    }
    const ks=Object.keys(SCEN); state.scen=ks[(ks.indexOf(state.scen)+1)%ks.length]; renderChrome();
  }
}
$('#tourBtn').onclick=e=>{ state.tour=!state.tour; e.currentTarget.setAttribute('aria-pressed',state.tour); e.currentTarget.textContent=state.tour?'Stop tour':'Tour'; clearTimeout(tourT); if(state.tour) tour(); };
if('wakeLock' in navigator){ try{ navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){} }

route();
</script>
